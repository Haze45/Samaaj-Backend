services:
  - type: web
    name: samaajbot-api
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/samaajbot.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: CHROMA_DIR
        value: /app/data/chroma_db
    disk:
      name: samaajbot-data
      mountPath: /app/data
      sizeGB: 1